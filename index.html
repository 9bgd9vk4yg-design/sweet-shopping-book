<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff3f0"><title>甜甜購物簿</title>
<style>
body{margin:0;padding:16px;background:linear-gradient(150deg,#fff1f3,#fffaf2);font-family:-apple-system,"PingFang TC",sans-serif;color:#604b53}.wrap{max-width:550px;margin:auto}.hero,.card{background:#fffdfb;border:1px solid #f2dce2;border-radius:22px;padding:17px;margin:12px 0;box-shadow:0 5px 16px #e9cbd322}.hero{background:#fff8f6}h1{margin:0;font-size:25px}.sub{color:#b08b95;font-size:12px;margin-top:5px}.tabs{display:flex;gap:8px;margin:14px 0}.tab{flex:1;border:0;border-radius:13px;padding:11px;background:#f7e4e9;color:#a36179;font-weight:bold}.tab.active,.primary{background:#bd7188;color:white}.field{margin:10px 0}.row{display:flex;gap:9px}.row>div{flex:1;min-width:0}label{display:block;font-size:12px;color:#a17a84;margin-bottom:5px}input,select{width:100%;box-sizing:border-box;border:1px solid #f0dce1;background:#fff9f8;border-radius:12px;padding:11px;font-size:16px;color:#604b53}button{font-family:inherit;cursor:pointer}.primary{width:100%;border:0;border-radius:14px;padding:13px;font-size:16px;font-weight:bold}.small{border:0;background:#f7e4e9;color:#a36179;border-radius:10px;padding:8px 10px}.total{background:#fbe9ee;border-radius:16px;padding:14px;text-align:center;margin:12px 0}.total small{display:block;color:#a06b7d}.total strong{font-size:27px;color:#b65f7d}.item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px dashed #f0dce1}.item:last-child{border:0}.name{font-weight:bold;flex:1}.muted{font-size:12px;color:#aa8b92;margin-top:4px}.price{font-weight:bold;color:#b45e7b;white-space:nowrap}.empty{text-align:center;color:#b69aa2;padding:22px 5px}.hidden{display:none!important}.title{font-weight:bold;margin-bottom:12px}.hist{padding:12px 0;border-bottom:1px solid #f3e3e7}.histhead{display:flex;justify-content:space-between;font-weight:bold}.histitems{font-size:13px;color:#9b7d85;margin:6px 0;line-height:1.7}footer{text-align:center;color:#c5a4ad;font-size:11px;margin:20px}
</style><div class="wrap"><div class="hero"><h1>🛒 甜甜購物簿</h1><div class="sub">把每一次採買，收進可愛的小日子 ♡</div></div>
<div class="tabs"><button class="tab active" data-tab="buy">🧺 今日採買</button><button class="tab" data-tab="history">📚 歷史紀錄</button><button class="tab" data-tab="price">📈 價格比較</button></div>
<section id="buy"><div class="card"><div class="title">✿ 新增商品</div><div class="field"><label>商品名稱</label><input id="name" placeholder="豬肉、雞蛋、牛奶"></div><div class="row"><div><label>數量</label><input id="qty" type="number" min=".01" step="any" value="1"></div><div><label>單位</label><input id="unit" placeholder="斤／包／盒"></div></div><div class="row field"><div><label>單價（元）</label><input id="unitPrice" type="number" min="0" step="any" placeholder="輸入單價"></div><div><label>商品金額（自動）</label><input id="lineTotal" readonly value="$0"></div></div><div class="field"><label>備註</label><input id="note" placeholder="品牌、店家等（選填）"></div><button class="primary" id="add">＋ 加入今日清單</button></div><div class="total"><small>今日購物總金額</small><strong id="todayTotal">$0</strong></div><div class="card"><div class="title">🌷 今天買了什麼　<button class="small" id="saveDay">保存今日紀錄</button></div><div id="todayList" class="empty">還沒有商品，先新增一筆吧 ♡</div></div><div class="card"><div class="title">💾 資料備份與還原</div><div class="muted" style="margin-bottom:10px">備份今日清單與歷史紀錄，換裝置也能匯入還原。</div><div class="row"><button class="small" id="exportBackup" style="flex:1">⬇️ 匯出備份</button><button class="small" id="importBackup" style="flex:1">⬆️ 匯入還原</button></div><input id="backupFile" type="file" accept=".json,application/json" style="display:none"></div></section>
<section id="history" class="hidden"><div class="card"><div class="title">📅 過去購物紀錄</div><div id="historyList" class="empty">尚未保存紀錄</div></div></section>
<section id="price" class="hidden"><div class="card"><div class="title">🔎 商品歷史單價</div><label>選擇商品</label><select id="priceSelect"><option value="">請選擇商品</option></select><div id="priceResult" class="empty">選擇商品即可查看歷次價格</div></div></section><footer>甜甜購物簿 · 每一筆都好好記錄 ♡</footer></div>
<script>
const $=id=>document.getElementById(id),today=()=>new Date().toLocaleDateString('sv-SE');let items=JSON.parse(localStorage.getItem('sweetItems')||'[]'),records=JSON.parse(localStorage.getItem('sweetRecords')||'[]');
const money=n=>'$'+Number(n||0).toLocaleString('zh-TW',{maximumFractionDigits:2}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem('sweetItems',JSON.stringify(items));localStorage.setItem('sweetRecords',JSON.stringify(records))}
function calc(){$('lineTotal').value=money((+ $('qty').value||0)*(+ $('unitPrice').value||0))}$('qty').oninput=calc;$('unitPrice').oninput=calc;
function renderToday(){let el=$('todayList');if(!items.length){el.className='empty';el.textContent='還沒有商品，先新增一筆吧 ♡';$('todayTotal').textContent=money(0);return}el.className='';el.innerHTML=items.map((x,i)=>`<div class="item"><div class="name">${esc(x.name)}<div class="muted">${x.qty} ${esc(x.unit)} × ${money(x.price)}${x.note?' · '+esc(x.note):''}</div></div><div class="price">${money(x.qty*x.price)}</div><button class="small" data-del="${i}">刪除</button></div>`).join('');$('todayTotal').textContent=money(items.reduce((s,x)=>s+x.qty*x.price,0));el.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{items.splice(+b.dataset.del,1);save();renderToday()})}
$('add').onclick=()=>{let name=$('name').value.trim(),qty=+$('qty').value,price=+$('unitPrice').value;if(!name){alert('請先輸入商品名稱♡');return}if(!(qty>0)||$('unitPrice').value===''||price<0){alert('請輸入正確數量和單價');return}items.push({name,qty,unit:$('unit').value.trim(),price,note:$('note').value.trim()});save();renderToday();$('name').value='';$('qty').value='';$('unit').value='';$('unitPrice').value='';$('note').value='';calc()};
$('exportBackup').onclick=()=>{const data={app:'sweet-shopping-book',version:1,exportedAt:new Date().toISOString(),items,records};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='甜甜購物簿備份_'+today()+'.json';a.click();URL.revokeObjectURL(url);alert('備份檔已匯出♡ 請妥善保存！')};$('importBackup').onclick=()=> $('backupFile').click();$('backupFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!Array.isArray(data.items)||!Array.isArray(data.records))throw Error('格式不符');if(!confirm('匯入會覆蓋目前這台裝置的清單與歷史紀錄，確定要還原嗎？'))return;items=data.items;records=data.records;save();renderToday();renderHistory();renderPrices();alert('資料還原完成♡')}catch(err){alert('備份檔讀取失敗，請選擇甜甜購物簿匯出的 JSON 檔')}finally{e.target.value=''}};
$('saveDay').onclick=()=>{if(!items.length){alert('今天還沒有商品喔');return}let d=today(),r={date:d,items:JSON.parse(JSON.stringify(items)),total:items.reduce((s,x)=>s+x.qty*x.price,0)},i=records.findIndex(x=>x.date===d);if(i>=0){if(!confirm('今天已保存，要更新紀錄嗎？'))return;records[i]=r}else records.unshift(r);save();renderHistory();renderPrices();alert('今日購物紀錄已保存♡')};
function renderHistory(){let el=$('historyList');if(!records.length){el.className='empty';el.textContent='尚未保存紀錄';return}el.className='';el.innerHTML=records.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(r=>`<div class="hist"><div class="histhead"><span>🗓️ ${r.date}</span><span class="price">${money(r.total)}</span></div><div class="histitems">${r.items.map(x=>`${esc(x.name)} ${x.qty}${esc(x.unit)} × ${money(x.price)} = ${money(x.qty*x.price)}`).join('<br>')}</div><button class="small" data-rdel="${records.indexOf(r)}">刪除紀錄</button></div>`).join('');el.querySelectorAll('[data-rdel]').forEach(b=>b.onclick=()=>{if(confirm('確定刪除這天紀錄？')){records.splice(+b.dataset.rdel,1);save();renderHistory();renderPrices()}})}
function renderPrices(){let names=[...new Set(records.flatMap(r=>r.items.map(x=>x.name)))].sort(),sel=$('priceSelect'),old=sel.value;sel.innerHTML='<option value="">請選擇商品</option>'+names.map(n=>`<option>${esc(n)}</option>`).join('');sel.value=names.includes(old)?old:'';showPrices()}
function showPrices(){let n=$('priceSelect').value,el=$('priceResult');if(!n){el.className='empty';el.textContent='選擇商品即可查看歷次價格';return}let rows=records.slice().sort((a,b)=>a.date.localeCompare(b.date)).flatMap(r=>r.items.filter(x=>x.name===n).map(x=>({date:r.date,price:x.price,unit:x.unit})));if(!rows.length)return;let diff=rows.at(-1).price-rows[0].price;el.className='';el.innerHTML=`<div class="total"><small>最近一次單價</small><strong>${money(rows.at(-1).price)}</strong><div>${diff>0?'📈 漲了 '+money(diff):diff<0?'📉 降了 '+money(-diff):'價格持平'}</div></div>`+rows.map(r=>`<div class="item"><div class="name">${r.date}<div class="muted">${esc(r.unit)}</div></div><div class="price">${money(r.price)}</div></div>`).join('')}
$('priceSelect').onchange=showPrices;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t===b));['buy','history','price'].forEach(id=>$(id).classList.toggle('hidden',id!==b.dataset.tab));renderHistory();renderPrices()});renderToday();renderHistory();renderPrices();calc();
</script></html>
